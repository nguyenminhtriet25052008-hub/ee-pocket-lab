<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="1" stop-color="#0f2942"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1e3a5f" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.65"/>
  <!-- Oscilloscope sine + square wave -->
  <path d="M720 155 Q750 65 780 155 T840 155 T900 155 T960 155 T1020 155 T1080 155 T1140 155"
        fill="none" stroke="url(#glow)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M720 225 H765 V195 H810 V225 H855 V195 H900 V225 H945 V195 H990 V225 H1035 V195 H1080 V225 H1140"
        fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4,2" opacity="0.85"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="68" y="88" fill="#64748b" font-size="24">$ python tools/<tspan fill="#22d3ee">rcfilter</tspan>.py -r 1k -c 100n --bode</text>
    <text x="65" y="172" fill="#f8fafc" font-size="72" font-weight="700">ee-pocket<tspan fill="url(#glow)">-lab</tspan></text>
    <text x="68" y="228" fill="#cbd5e1" font-size="26">10 Electrical &amp; Embedded Engineering CLI calculators · zero deps</text>
  </g>
</svg>
